# SWAG reverse-proxy config for kvasir.blinkneuron.eu
# Install to: /mnt/user/appdata/swag/nginx/site-confs/kvasir.blinkneuron.eu.conf
#
# Prerequisites:
#   1. DNS: kvasir.blinkneuron.eu -> the home WAN address (same target as decks.blinkneuron.eu)
#   2. SWAG env: EXTRA_DOMAINS must list kvasir.blinkneuron.eu, then restart SWAG so
#      Let's Encrypt issues the certificate (HTTP-01, port 80 must reach SWAG).
#   3. Container: kvasir running on 192.168.88.98:8688
#
# Modelled on decks.blinkneuron.eu.conf — blinkneuron.eu is a secondary domain here, so its
# hosts live in site-confs rather than in proxy-confs (those are for *.prawdzik.eu).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name kvasir.blinkneuron.eu;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/resolver.conf;

        proxy_http_version 1.1;
        proxy_connect_timeout 60;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
        proxy_redirect http:// $scheme://;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        set $upstream_app 192.168.88.98;
        set $upstream_port 8688;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
